name: CI

on:
  # Skip pull requests that only touch documentation; the docs workflow covers
  # those. The filter excludes rather than lists, so a new source directory or
  # config file runs CI by default. Nothing under docs/ is YAML, and the docs
  # workflow yamllints roadmap.yml, so yamllint loses nothing. No check is
  # required by the rulesets, which is what makes a workflow-level filter safe:
  # a skipped required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"
      - "!roadmap.yml"
  workflow_dispatch:
  # Callable so the release pipeline gates on the exact same checks rather than
  # a second copy of them. There is deliberately no `push` trigger: release.yaml
  # runs on every push to main and calls this workflow, so a push trigger here
  # would run everything twice against the same commit.
  workflow_call:
    inputs:
      # Every commit on main lands through a pull request whose run already
      # fuzzed it and benchmarked it against its base. On main, HEAD^ is that
      # same base, so the release run would repeat the PR's comparison.
      skip-fuzz-and-bench:
        type: boolean
        default: false
      # The same holds for the examples: the pull request's run checked them
      # against the commit that lands. The release ships none of them, so a
      # release doesn't wait on their Rust and Next.js builds.
      skip-examples:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  # Each job installs the tools it needs with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first, gopls and
  # delve included, which makes each job wait on (and fail with) the module
  # proxy for tools it never runs.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.9.18

permissions:
  contents: read

# A new push to a PR supersedes the run in flight. Everything else is keyed on
# the commit SHA: inside a called workflow `github.workflow` resolves to the
# caller's name, so keying on `github.ref` would make every push's nested CI run
# share one group and evict each other. The literal `ci` keeps the group apart
# from the caller's own group, which would otherwise deadlock.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go golangci-lint yamllint actionlint shellcheck

      # Go's module and build caches, and golangci-lint's analysis cache. Like
      # setup-go, the key is the dependency set: the first run after go.sum
      # changes saves it (main's run, which pull requests then restore), and it
      # isn't rewritten until go.sum changes again. The dependencies, which are
      # most of the build, stay cached throughout. Each job keys its own,
      # because each builds for different flags or targets.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-

      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      # Builds ./custom-gcl (golangci-lint + golint-sl) and runs it. The golint-sl
      # plugin and the gofmt/goimports formatters are both applied here.
      - name: Lint Go
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run lint

      # The cached path skips `mise run lint`, so it runs the .sigil
      # formatting check by hand. yamllint and actionlint have steps of their
      # own below.
      - name: Lint Go with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ./custom-gcl
          ./custom-gcl run ./...
          mise run sigil-lint

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      # See the lint job. The build cache holds test results too, so a package
      # whose code and inputs didn't change since the cache was saved reports
      # (cached) rather than running again.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: Run tests
        run: mise run test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # sigil compile writes a copy of the sigil binary with the policies in it.
  # On macOS the kernel checks every page of a binary it runs against the
  # hashes in its code signature, and kills one that doesn't match, so
  # compile re-hashes the pages it writes. The unit test job runs these same
  # tests on Linux, where nothing checks a signature; here the binaries that
  # stamp patches and that compile writes, and the copies of them that the
  # end-to-end tests move, really run.
  macos:
    name: Compiled binaries on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      # See the lint job. On macOS the build cache lives under
      # ~/Library/Caches.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-macos-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-macos-${{ runner.os }}-

      # The end-to-end tests in cmd/sigil build sigil and the deploy-gates
      # example's sigilc, compile with both, and run what they wrote.
      - name: Run the stamp, payload, compile and end-to-end tests
        run: go test ./internal/stamp/ ./internal/payload/ ./cmd/sigil/command/compile/ ./cmd/sigil/

  # The WebAssembly module (cmd/sigil-wasm), built once for every job that
  # loads it: its own tests, the TypeScript package, the Rust crate, and the
  # examples on them. They all test this one file.
  wasm-build:
    name: WebAssembly module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      # See the lint job.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-wasm-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-wasm-build-${{ runner.os }}-

      - name: Build the module
        run: mise run wasm-build

      - name: Keep the module for the jobs that load it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigil-wasm
          path: dist/wasm/sigil.wasm
          if-no-files-found: error
          retention-days: 1

  # The module's end-to-end tests are a Go module of their own,
  # cmd/sigil-wasm/test, which the lint and test jobs above stop at, and its
  # glue only builds for wasip1, so this job lints both and drives the module
  # through its ABI.
  #
  # Every job that downloads the module touches it afterwards: the checkout
  # left its sources newer than whatever time the artifact kept, and a module
  # newer than its sources is one the wasm-build task skips.
  wasm:
    name: WebAssembly module tests
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go golangci-lint

      # See the lint job. The test module has a go.sum of its own.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/sigil-wasm/test/go.sum') }}
          restore-keys: go-wasm-${{ runner.os }}-

      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        run: touch dist/wasm/sigil.wasm

      # Same key as the lint job: custom-gcl is built from the root config and
      # lints every module.
      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      - name: Lint the module's glue and its tests
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run wasm-lint

      - name: Lint the module's glue and its tests with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ./custom-gcl
          GOOS=wasip1 GOARCH=wasm ./custom-gcl run ./cmd/sigil-wasm/... ./internal/engine/...
          cd cmd/sigil-wasm/test && ../../../custom-gcl run --config ../../../.golangci.yaml ./...

      - name: Test the module through its ABI
        run: mise run wasm-test

  # bindings/typescript loads the module, and its tests compare records with
  # the sigil CLI, so the job needs go as well as bun.
  typescript:
    name: TypeScript package
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go bun

      # See the wasm job.
      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        run: touch dist/wasm/sigil.wasm

      - name: Test the TypeScript package
        run: mise run ts-test

      # tsc type-checks the package again as it emits dist/.
      - name: Build the TypeScript package
        run: mise run ts-build

  # bindings/rust embeds the module, and its tests compare records with the
  # sigil CLI and kind files with Go's generator, so the job needs go as well
  # as rust.
  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go rust

      # rust-cache keys on the toolchain and the lockfile, and drops the
      # crate's own build output before it saves, so the cache holds the
      # registry and the compiled dependencies. Only main's run saves; pull
      # requests restore it. ~/.cargo/bin holds mise's rustup proxies, not
      # anything cargo installed, so it stays out.
      - name: Cache cargo registry and dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/rust
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # See the wasm job.
      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        run: touch dist/wasm/sigil.wasm

      - name: Check formatting and lint the crate
        run: mise run rust-lint

      # Also builds the docs with warnings as errors, so broken intra-doc
      # links fail here.
      - name: Test the crate
        run: mise run rust-test

      # What the release publishes to crates.io: the package with sigil.wasm
      # inside, built from the package alone.
      - name: Package the crate
        run: mise run rust-package

  # The examples. None of them ships with a release, and every commit on main
  # was checked by its pull request's run, so release runs skip them (see the
  # skip-examples input). The build job doesn't wait for them either.

  # examples/deploy-gates is a Go module of its own, so the lint and test jobs
  # above stop at its go.mod; this runs the same gates inside it. It doesn't
  # start a compose stack or build snapshots; the images job builds its image.
  deploy-gates:
    name: Example (deploy-gates)
    if: ${{ !inputs.skip-examples }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/deploy-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go golangci-lint goreleaser
          working_directory: examples/deploy-gates

      # Same key as the lint job: custom-gcl is built from the root config and
      # lints every module.
      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      - name: Lint Go
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run lint

      - name: Lint Go with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ../../custom-gcl
          ../../custom-gcl run --config ../../.golangci.yaml --build-tags e2e ./...

      # Includes every policy test file, through policytest.
      - name: Run tests
        run: mise run test

      # sigilc check with the platform as the trusted source, and sigilc test:
      # what a policy repository's CI runs.
      - name: Check policies
        run: mise run policies

      - name: Validate GoReleaser config
        run: mise run release-check

  # examples/alert-routing is a TypeScript service on the module and the
  # package above. Its install task builds the package from this checkout
  # first. The Playwright smoke test is the one place a real browser runs the
  # module, through the package's worker helper.
  alert-routing:
    name: Example (alert-routing)
    if: ${{ !inputs.skip-examples }}
    runs-on: ubuntu-latest
    needs: wasm-build
    defaults:
      run:
        working-directory: examples/alert-routing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go bun node
          working_directory: examples/alert-routing

      # See the wasm job.
      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        working-directory: .
        run: touch dist/wasm/sigil.wasm

      - name: Install
        run: mise run install

      # Lint, typecheck, unit and integration tests, the policies through the
      # sigil CLI, and the standalone Next.js build.
      - name: Check
        run: mise run check

      - name: Install Chromium for the UI smoke test
        run: bun run ui:install -- --with-deps

      - name: UI smoke test
        run: bun run test:ui

  # examples/feature-flags is a Rust service on the crate above. The policy
  # check runs the sigil CLI with go.
  feature-flags:
    name: Example (feature-flags)
    if: ${{ !inputs.skip-examples }}
    runs-on: ubuntu-latest
    needs: wasm-build
    defaults:
      run:
        working-directory: examples/feature-flags
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go rust k6
          working_directory: examples/feature-flags

      # See the rust job. Release runs skip this job, so main never saves a
      # cache for it; each pull request's run saves its own instead.
      - name: Cache cargo registry and dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/feature-flags
          cache-bin: false

      # See the wasm job.
      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        working-directory: .
        run: touch dist/wasm/sigil.wasm

      # Lint, unit and integration tests, the policies through the sigil CLI,
      # the k6 suite parsed, and the release build.
      - name: Check
        run: mise run check

  # Each example's compose stack builds its service's image from the
  # repository root, so CI builds every image the same way and runs nothing
  # in it. The images build sigil.wasm and the service themselves, so these
  # run alongside the example jobs rather than after them.
  images:
    name: Docker image (${{ matrix.example }})
    if: ${{ !inputs.skip-examples }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - alert-routing
          - deploy-gates
          - feature-flags
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -f examples/${{ matrix.example }}/Dockerfile .

  build:
    name: Build with GoReleaser
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - wasm
      - typescript
      - rust
    # Fuzz and benchmark are skipped on release runs; a skipped need would skip
    # this job too, so only a failure or cancellation stops it.
    if: ${{ !cancelled() && !failure() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go goreleaser

      # See the lint job.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-goreleaser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-goreleaser-${{ runner.os }}-

      # GoReleaser builds the tagged tree unchanged, so go.mod must be tidy
      # before it's ever tagged.
      - name: Check go.mod is tidy
        run: mise run mod-tidy

      - name: Validate GoReleaser config
        run: mise run release-check

      - name: Build with GoReleaser (snapshot)
        run: mise run snapshot

  fuzz:
    name: Fuzz smoke tests
    if: ${{ !inputs.skip-fuzz-and-bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # devtool reads each fuzz run flag from FUZZ_<FLAG>.
    env:
      FUZZ_TIME: 5s
      FUZZ_TIMEOUT: 1m
      FUZZ_CPU: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      - name: Fuzz every target
        timeout-minutes: 5
        run: mise run fuzz

      - name: Publish results in job summary
        if: always()
        run: |
          if test -f fuzz-results/summary.md; then
            cat fuzz-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the log and failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-regressions
          path: |
            fuzz-results/
            **/testdata/fuzz/**
          if-no-files-found: ignore

  benchmark:
    name: Benchmark regressions
    if: ${{ !inputs.skip-fuzz-and-bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # devtool reads each bench run flag from BENCH_<FLAG>. PRs compare the
      # tested merge result with its base; manual runs compare the checked-out
      # commit with its parent.
      BENCH_BASELINE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
      BENCH_COUNT: "10"
      BENCH_TIME: 200ms
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go go:golang.org/x/perf/cmd/benchstat

      # The regression gate's own tests need benchstat, which only this job
      # installs; the unit test job skips them.
      - name: Test regression detection with benchstat
        run: go test ./cmd/devtool/command/bench/

      # Build both revisions first, then alternate sample order on this one
      # runner. The current benchmark files and fixtures run against both.
      - name: Compare performance with base
        run: mise run bench

      - name: Publish comparison in job summary
        if: always()
        run: |
          if test -f benchmark-results/summary.md; then
            cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark comparison did not complete; inspect the run logs and artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: benchmark-results/
          if-no-files-found: warn
