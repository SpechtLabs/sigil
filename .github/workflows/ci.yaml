name: CI

on:
  # Skip pull requests that only touch documentation; the docs workflow covers
  # those. The filter excludes rather than lists, so a new source directory or
  # config file runs CI by default. Nothing under docs/ is YAML, and the docs
  # workflow yamllints roadmap.yml, so yamllint loses nothing. No check is
  # required by the rulesets, which is what makes a workflow-level filter safe:
  # a skipped required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"
      - "!roadmap.yml"
  workflow_dispatch:
  # Callable so the release pipeline gates on the exact same checks rather than
  # a second copy of them. There is deliberately no `push` trigger: release.yaml
  # runs on every push to main and calls this workflow, so a push trigger here
  # would run everything twice against the same commit.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Each job installs the tools it needs with mise-action's install_args. Without
# this, `mise run` installs every tool in .mise.toml first, gopls and delve
# included, which makes each job wait on (and fail with) the module proxy for
# tools it never runs.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

permissions:
  contents: read

# A new push to a PR supersedes the run in flight. Everything else is keyed on
# the commit SHA: inside a called workflow `github.workflow` resolves to the
# caller's name, so keying on `github.ref` would make every push's nested CI run
# share one group and evict each other. The literal `ci` keeps the group apart
# from the caller's own group, which would otherwise deadlock.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go golangci-lint yamllint actionlint shellcheck

      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      # Builds ./custom-gcl (golangci-lint + golint-sl) and runs it. The golint-sl
      # plugin and the gofmt/goimports formatters are both applied here.
      - name: Lint Go
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run lint

      # The cached path skips `mise run lint`, so it runs the .sigil
      # formatting check by hand. yamllint and actionlint have steps of their
      # own below.
      - name: Lint Go with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ./custom-gcl
          ./custom-gcl run ./...
          mise run sigil-lint

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint
          mise run shell-lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Run tests
        run: mise run test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build with GoReleaser
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - fuzz
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go goreleaser

      # GoReleaser builds the tagged tree unchanged, so go.mod must be tidy
      # before it's ever tagged.
      - name: Check go.mod is tidy
        run: mise run mod-tidy

      - name: Validate GoReleaser config
        run: mise run release-check

      - name: Build with GoReleaser (snapshot)
        run: mise run snapshot

  fuzz:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Fuzz every target
        run: mise run fuzz

      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-regressions
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
