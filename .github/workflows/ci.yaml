name: CI

# Everything a pull request runs. Each part is a workflow of its own, which
# release.yaml calls in part (go.yaml and wasm.yaml gate every release) and
# which runs on its own from the Actions tab.
on:
  # Skip pull requests that only touch documentation; the docs workflow covers
  # those. The filter excludes rather than lists, so a new source directory or
  # config file runs CI by default. Nothing under docs/ is YAML, and the docs
  # workflow yamllints roadmap.yml, so yamllint loses nothing. No check is
  # required by the rulesets, which is what makes a workflow-level filter safe:
  # a skipped required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"
      - "!roadmap.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    uses: ./.github/workflows/go.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  wasm:
    name: WebAssembly
    uses: ./.github/workflows/wasm.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  examples:
    name: Examples
    uses: ./.github/workflows/examples.yaml

  fuzz-and-bench:
    name: Fuzz and benchmarks
    uses: ./.github/workflows/fuzz-and-bench.yaml
