name: WebAssembly

# The WebAssembly module and the two packages around it, the TypeScript
# package and the Rust crate. ci.yaml calls it for pull requests, release.yaml
# gates every release on it (the release publishes both packages), and it runs
# on its own from the Actions tab.
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

# See go.yaml for all three.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.5
  MISE_TOOLS: go golangci-lint yamllint actionlint shellcheck goreleaser bun node go:golang.org/x/perf/cmd/benchstat

jobs:
  # The module (cmd/sigil-wasm), built once for every job here that loads it:
  # its own tests, the TypeScript package and the Rust crate all test this one
  # file.
  wasm-build:
    name: Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # See go.yaml's lint job.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-wasm-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-wasm-build-${{ runner.os }}-

      - name: Build the module
        run: mise run wasm-build

      - name: Keep the module for the jobs that load it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigil-wasm
          path: dist/wasm/sigil.wasm
          if-no-files-found: error
          retention-days: 1

  # The module's end-to-end tests are a Go module of their own,
  # cmd/sigil-wasm/test, which go.yaml's lint and test jobs stop at, and its
  # glue only builds for wasip1, so this job lints both and drives the module
  # through its ABI.
  #
  # Every job that downloads the module touches it afterwards: the checkout
  # left its sources newer than whatever time the artifact kept, and a module
  # newer than its sources is one the wasm-build task skips.
  wasm:
    name: Module tests
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # See go.yaml's lint job. The test module has a go.sum of its own.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'cmd/sigil-wasm/test/go.sum') }}
          restore-keys: go-wasm-${{ runner.os }}-

      - name: Download the WebAssembly module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        run: touch dist/wasm/sigil.wasm

      # Same key as go.yaml's lint job: custom-gcl is built from the root
      # config and lints every module.
      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      - name: Lint the module's glue and its tests
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run wasm-lint

      - name: Lint the module's glue and its tests with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ./custom-gcl
          GOOS=wasip1 GOARCH=wasm ./custom-gcl run ./cmd/sigil-wasm/... ./internal/engine/...
          cd cmd/sigil-wasm/test && ../../../custom-gcl run --config ../../../.golangci.yaml ./...

      - name: Test the module through its ABI
        run: mise run wasm-test

  # bindings/typescript loads the module, and its tests compare records with
  # the sigil CLI, so the job needs go as well as bun.
  typescript:
    name: TypeScript package
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # See the wasm job.
      - name: Download the WebAssembly module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        run: touch dist/wasm/sigil.wasm

      # bunfig.toml has bun test write coverage/lcov.info for src/, with paths
      # relative to the package; Codecov matches them against the repository.
      - name: Test the TypeScript package
        run: mise run ts-test

      - name: Point the coverage report at the repository root
        run: perl -pi -e 's{^SF:}{SF:bindings/typescript/}' bindings/typescript/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bindings/typescript/coverage/lcov.info
          disable_search: true
          flags: typescript
          fail_ci_if_error: false

      # tsc type-checks the package again as it emits dist/.
      - name: Build the TypeScript package
        run: mise run ts-build

  # bindings/rust embeds the module, and its tests compare records with the
  # sigil CLI and kind files with Go's generator, so the job needs go as well
  # as rust.
  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise installs Rust with the runner's rustup, which keeps the toolchain
      # in ~/.rustup, outside mise's cache, and downloads it again on every
      # run without this. The key is the version .mise.toml pins. Every job
      # that installs Rust restores the toolchain the same way.
      - name: Read the pinned Rust version
        id: rust
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          components="$(sed -n 's/^rust = {.*components = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # A cache key can't hold commas.
          echo "components=${components//,/-}" >> "${GITHUB_OUTPUT}"

      - name: Cache the Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.version }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.version }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.components }}

      # MISE_TOOLS plus rust and cargo-llvm-cov, for the coverage run: a mise
      # cache of its own, which main's runs save like the first.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }} rust aqua:taiki-e/cargo-llvm-cov

      # rust-cache keys on the toolchain and the lockfile, and drops the
      # crate's own build output before it saves, so the cache holds the
      # registry and the compiled dependencies. Only main's run saves; pull
      # requests restore it. ~/.cargo/bin holds mise's rustup proxies, not
      # anything cargo installed, so it stays out.
      - name: Cache cargo registry and dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/rust
          # release.yaml's crates job restores this cache by the same key.
          shared-key: bindings-rust
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # See the wasm job.
      - name: Download the WebAssembly module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sigil-wasm
          path: dist/wasm

      - name: Mark the module up to date
        run: touch dist/wasm/sigil.wasm

      - name: Check formatting and lint the crate
        run: mise run rust-lint

      # The tests rust-test runs, with both feature sets, instrumented for
      # coverage. It replaces rust-test here, so the tests run once.
      - name: Test the crate with coverage
        run: mise run rust-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bindings/rust/lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: false

      # The rest of rust-test: the docs with warnings as errors, so broken
      # intra-doc links fail here.
      - name: Build the crate's docs
        run: mise run rust-doc

      # What the release publishes to crates.io: the package with sigil.wasm
      # inside, built from the package alone.
      - name: Package the crate
        run: mise run rust-package
