name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or repair (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  id-token: write
  pull-requests: write

env:
  # mise itself, pinned; go.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.6

# Never cancel a release half-way: that can leave a tag published with no
# artifacts. Pushes key on the SHA so each commit gets its own run; repairs key
# on the tag so two repairs of the same tag cannot race. Only the gate jobs
# below cancel anything, and only each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  # The gate: what the release builds and publishes, the Go module (go.yaml)
  # and the WebAssembly module with its two packages (wasm.yaml). The
  # examples, fuzzing and benchmarks ran on the pull request; ci.yaml has all
  # of it.
  #
  # A push to main that lands while an older push is still in its gate
  # cancels that gate: the older run then skips release-please, which would
  # only find that main has moved on. Each gate job has a group of its own, so
  # the two don't cancel each other, and nothing after the gate is in one, so
  # a run that got past its gate publishes to the end. Repairs never cancel.
  go:
    name: Go
    uses: ./.github/workflows/go.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    concurrency:
      group: ${{ github.workflow }}-gate-go-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

  wasm:
    name: WebAssembly
    uses: ./.github/workflows/wasm.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    concurrency:
      group: ${{ github.workflow }}-gate-wasm-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

  # The VS Code extension's gate (editors.yaml, which tests the tree-sitter
  # grammar too). Only the vscode job waits for it, so release-please and
  # GoReleaser never do. It has no group: a newer
  # push cancelling it would leave this run's release without the extension,
  # since only the run that created a release publishes it.
  editors:
    name: Editors
    uses: ./.github/workflows/editors.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs:
      - go
      - wasm
    if: github.event_name == 'push'
    steps:
      # Renovate automerges in quick succession. A run whose commit is no longer
      # main's tip leaves release-please to the newer run, so a stale run cannot
      # rewrite the release PR behind a newer one.
      - name: Refuse to act unless this run's head is still main's tip
        id: still-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $tip since this run started at ${{ github.sha }}; leaving release-please to that run."
          fi

      # GitHub doesn't start workflows for what GITHUB_TOKEN does: a release
      # pull request it opens or updates gets a CI run that waits for
      # approval. RELEASE_PLEASE_TOKEN, a fine-grained personal access token
      # with read and write access to this repository's contents, pull
      # requests and issues, makes the pull request an ordinary one whose CI
      # runs. Without the secret, release-please falls back to GITHUB_TOKEN.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        if: steps.still-current.outputs.current == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  goreleaser:
    name: GoReleaser Build & Publish
    runs-on: ubuntu-latest
    needs:
      - go
      - wasm
      - release-please
    if: >-
      always() &&
      needs.go.result == 'success' &&
      needs.wasm.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      # A repair publishes an old tag with the current GoReleaser config, so a
      # config fix on main can rescue a release that failed to publish.
      - name: Checkout retry configuration
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preserve retry configuration
        if: github.event_name == 'workflow_dispatch'
        run: cp .goreleaser.yaml "${RUNNER_TEMP}/goreleaser.yaml"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go goreleaser

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        run: goreleaser release --clean --config "${CONFIG}"
        env:
          CONFIG: ${{ github.event_name == 'workflow_dispatch' && format('{0}/goreleaser.yaml', runner.temp) || '.goreleaser.yaml' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # @spechtlabs/sigil carries the release's version (release-please bumps
  # bindings/typescript/package.json with the Go release), so the package on
  # npm always holds the engine of the tag it was built from. It publishes
  # after GoReleaser, so a release that failed to build never reaches npm.
  #
  # npm trusted publishing: the registry trusts this workflow through OIDC,
  # so no token lives in the repository, and every version gets a provenance
  # attestation. Trust can only be configured for a package that exists, so
  # the very first version needs NPM_TOKEN once; delete the secret after
  # configuring the trusted publisher on npmjs.com.
  npm:
    name: Publish @spechtlabs/sigil to npm
    runs-on: ubuntu-latest
    needs:
      - release-please
      - goreleaser
    if: >-
      always() &&
      needs.goreleaser.result == 'success'
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: bun node cosign

      # The module GoReleaser built, signed and attached to this release, not
      # one built again here, so the registry gets the bytes the GitHub
      # release has, with the version GoReleaser stamped into them. cosign
      # checks the signature over checksums.txt against release.yaml on main,
      # the only identity a release is signed with, whichever ref this run
      # started from, and the archive's line in it checks the archive. Go isn't
      # installed, so a wasm-build task that decided to rebuild the module
      # would fail rather than replace it; the touch keeps the module newer
      # than its sources, which is what lets the task skip.
      - name: Fetch and verify the release's WebAssembly module
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: https://github.com/SpechtLabs/sigil/.github/workflows/release.yaml@refs/heads/main
        run: |
          set -euo pipefail
          release="${RUNNER_TEMP}/release"
          archive="sigil_${TAG#v}_wasip1_wasm.tar.gz"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${release}" \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json --pattern "${archive}"
          cosign verify-blob \
            --bundle "${release}/checksums.txt.sigstore.json" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${release}/checksums.txt"
          (cd "${release}" && grep "  ${archive}\$" checksums.txt | sha256sum --check --strict)
          mkdir -p dist/wasm
          tar -xzf "${release}/${archive}" -C dist/wasm sigil.wasm
          touch dist/wasm/sigil.wasm

      # The package, with the module above copied in.
      - name: Build the package
        run: mise run ts-build

      # A repair of an old tag, or a rerun, finds its version already on npm
      # and stops there instead of failing: npm never accepts a version twice.
      - name: Publish unless this version is on npm already
        working-directory: bindings/typescript
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::bindings/typescript/package.json is at ${version}, but the release is ${TAG}; release-please's extra-files should keep them in lockstep"
            exit 1
          fi
          if npm view "@spechtlabs/sigil@${version}" version >/dev/null 2>&1; then
            echo "::notice::@spechtlabs/sigil@${version} is on npm already; nothing to publish"
            exit 0
          fi
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          fi
          npm publish --provenance --access public

  # The Rust crate spechtlabs-sigil, versioned with Sigil like the npm package
  # (release-please bumps bindings/rust/Cargo.toml and its Cargo.lock entry).
  # The package carries the release's sigil.wasm, so installing the crate
  # needs no Go.
  #
  # crates.io trusted publishing: crates-io-auth-action trades this workflow's
  # OIDC token for a crates.io token that lives for the job and is revoked
  # after it. Trust can only be configured for a crate that exists, so the
  # very first version needs CARGO_REGISTRY_TOKEN once; delete the secret
  # after configuring the trusted publisher on crates.io.
  crates:
    name: Publish spechtlabs-sigil to crates.io
    runs-on: ubuntu-latest
    needs:
      - release-please
      - goreleaser
    if: >-
      always() &&
      needs.goreleaser.result == 'success'
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # See wasm.yaml's rust job: the toolchain, by the version the tag pins.
      - name: Read the pinned Rust version
        id: rust
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          components="$(sed -n 's/^rust = {.*components = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # A cache key can't hold commas.
          echo "components=${components//,/-}" >> "${GITHUB_OUTPUT}"

      - name: Cache the Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.version }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.version }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.components }}

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: rust cosign

      # A repair of a tag from before the crate, or a rerun that finds its
      # version on crates.io already, stops here instead of failing: crates.io
      # never accepts a version twice.
      - name: Decide whether to publish
        id: check
        run: |
          set -euo pipefail
          if [ ! -f bindings/rust/Cargo.toml ]; then
            echo "::notice::${TAG} has no bindings/rust; nothing to publish"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version="$(cargo metadata --manifest-path bindings/rust/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::bindings/rust/Cargo.toml is at ${version}, but the release is ${TAG}; release-please's extra-files should keep them in lockstep"
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'SpechtLabs/sigil release workflow (https://github.com/SpechtLabs/sigil)' \
            "https://crates.io/api/v1/crates/spechtlabs-sigil/${version}")"
          case "${status}" in
            200)
              echo "::notice::spechtlabs-sigil@${version} is on crates.io already; nothing to publish"
              echo "publish=false" >> "${GITHUB_OUTPUT}" ;;
            404)
              echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::crates.io answered ${status} for spechtlabs-sigil@${version}; rerun the job once it's reachable"
              exit 1 ;;
          esac

      # Packaging builds the crate, and its dependencies, from the package
      # alone. The CI run this release waited for saved them compiled for this
      # Cargo.lock under this key (see the rust job in wasm.yaml).
      - name: Restore cargo registry and dependencies
        if: steps.check.outputs.publish == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/rust
          shared-key: bindings-rust
          cache-bin: false
          save-if: false

      # See the npm job.
      - name: Fetch and verify the release's WebAssembly module
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: https://github.com/SpechtLabs/sigil/.github/workflows/release.yaml@refs/heads/main
        run: |
          set -euo pipefail
          release="${RUNNER_TEMP}/release"
          archive="sigil_${TAG#v}_wasip1_wasm.tar.gz"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${release}" \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json --pattern "${archive}"
          cosign verify-blob \
            --bundle "${release}/checksums.txt.sigstore.json" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${release}/checksums.txt"
          (cd "${release}" && grep "  ${archive}\$" checksums.txt | sha256sum --check --strict)
          mkdir -p dist/wasm
          tar -xzf "${release}/${archive}" -C dist/wasm sigil.wasm
          touch dist/wasm/sigil.wasm

      # Copies the module above into the package, and builds the crate from
      # the package alone.
      - name: Package the crate
        if: steps.check.outputs.publish == 'true'
        run: mise run rust-package

      - name: Get a crates.io token through trusted publishing
        id: auth
        if: steps.check.outputs.publish == 'true' && env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The package step verified this exact package, so publish doesn't
      # build it a second time. module/ is gitignored, hence --allow-dirty.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: bindings/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.BOOTSTRAP_TOKEN }}
        run: cargo publish --locked --allow-dirty --no-verify

  # The VS Code extension, versioned with Sigil (release-please bumps
  # editors/vscode/package.json with the Go release). Each platform's VSIX
  # bundles the sigil binary GoReleaser built, signed and attached to this
  # release, and the universal VSIX, which Open VSX serves on every other
  # platform, has none and runs sigil from PATH. This job attaches all of
  # them to the GitHub release, where VS Code users get them: the extension
  # isn't in the Visual Studio Marketplace. vscode-openvsx publishes the same
  # files to Open VSX.
  vscode:
    name: Publish the VS Code extension
    runs-on: ubuntu-latest
    needs:
      - release-please
      - goreleaser
      - editors
    if: >-
      always() &&
      needs.goreleaser.result == 'success' &&
      needs.editors.result == 'success'
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # A repair of a tag from before the extension stops here.
      - name: Decide whether to package
        id: check
        run: |
          set -euo pipefail
          if [ ! -f editors/vscode/package.json ]; then
            echo "::notice::${TAG} has no editors/vscode; nothing to publish"
            echo "package=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version="$(jq -r .version editors/vscode/package.json)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::editors/vscode/package.json is at ${version}, but the release is ${TAG}; release-please's extra-files should keep them in lockstep"
            exit 1
          fi
          echo "package=true" >> "${GITHUB_OUTPUT}"

      - name: Set up mise
        if: steps.check.outputs.package == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: bun node cosign

      # See the npm job: the archives this release has, checked against the
      # signed checksums.txt, not binaries built again here.
      - name: Fetch and verify the release's CLI archives
        if: steps.check.outputs.package == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: https://github.com/SpechtLabs/sigil/.github/workflows/release.yaml@refs/heads/main
        run: |
          set -euo pipefail
          release="${RUNNER_TEMP}/release"
          version="${TAG#v}"
          patterns=(--pattern checksums.txt --pattern checksums.txt.sigstore.json)
          archives=()
          for platform in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            archives+=("sigil_${version}_${platform}.tar.gz")
            patterns+=(--pattern "sigil_${version}_${platform}.tar.gz")
          done
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${release}" "${patterns[@]}"
          cosign verify-blob \
            --bundle "${release}/checksums.txt.sigstore.json" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${release}/checksums.txt"
          for archive in "${archives[@]}"; do
            (cd "${release}" && grep "  ${archive}\$" checksums.txt | sha256sum --check --strict)
          done

      # The universal VSIX and one per archive above (see
      # editors/vscode/scripts/package.ts).
      - name: Package the extension
        if: steps.check.outputs.package == 'true'
        run: |
          set -euo pipefail
          mise run vscode-build
          cd editors/vscode
          bun scripts/package.ts --release "${RUNNER_TEMP}/release" --out "${RUNNER_TEMP}/vsix"

      # --clobber: a rerun or a repair replaces the files rather than failing.
      - name: Attach the VSIX files to the release
        if: steps.check.outputs.package == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" "${RUNNER_TEMP}"/vsix/*.vsix --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Keep the VSIX files for the Open VSX job
        if: steps.check.outputs.package == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-vsix
          path: ${{ runner.temp }}/vsix/*.vsix
          if-no-files-found: error
          retention-days: 1

    outputs:
      package: ${{ steps.check.outputs.package }}

  # Open VSX, which VSCodium, Cursor, Gitpod, Theia and the other editors
  # built on VS Code install from. With OVSX_TRUSTED_PUBLISHING set to
  # true, ovsx trades GitHub's OIDC token for a short-lived publishing token,
  # which open-vsx.org issues to this workflow in the openvsx-publish
  # environment once the spechtlabs namespace registers it as a trusted
  # publisher; one token covers all five files. Until then the OVSX_PAT
  # secret publishes, and without either the job says so and skips. ovsx
  # reads OVSX_PAT from the environment and prefers it to trusted
  # publishing, so only the token step sees it.
  #
  # id-token: write covers the whole job, so nothing before the publish runs
  # third-party code: vscode-install passes --ignore-scripts, so installing
  # ovsx runs no package's install script, and ovsx is the first package
  # code that runs.
  vscode-openvsx:
    name: Publish the VS Code extension to Open VSX
    runs-on: ubuntu-latest
    needs:
      - release-please
      - vscode
    if: >-
      always() &&
      needs.vscode.result == 'success' &&
      needs.vscode.outputs.package == 'true'
    environment: openvsx-publish
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Decide how to publish
        id: check
        env:
          TRUSTED: ${{ vars.OVSX_TRUSTED_PUBLISHING }}
          HAS_PAT: ${{ secrets.OVSX_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "${TRUSTED}" = "true" ]; then
            echo "with=trusted-publishing" >> "${GITHUB_OUTPUT}"
          elif [ "${HAS_PAT}" = "true" ]; then
            echo "with=token" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Neither OVSX_TRUSTED_PUBLISHING nor OVSX_PAT is set; the extension isn't published to Open VSX"
            echo "with=none" >> "${GITHUB_OUTPUT}"
          fi

      # ovsx comes from the extension's dev dependencies, at the tag's pin
      # (1.2.0 or later has --trusted-publishing).
      - name: Checkout release tag
        if: steps.check.outputs.with != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up mise
        if: steps.check.outputs.with != 'none'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: bun node

      - name: Install ovsx
        if: steps.check.outputs.with != 'none'
        run: mise run vscode-install

      - name: Download the VSIX files
        if: steps.check.outputs.with != 'none'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vsix
          path: ${{ runner.temp }}/vsix

      # --skip-duplicate makes a rerun, or a repair of a version that's
      # published already, a no-op: Open VSX never accepts a version twice.
      - name: Publish to Open VSX with trusted publishing
        if: steps.check.outputs.with == 'trusted-publishing'
        working-directory: editors/vscode
        run: bunx ovsx publish --trusted-publishing --skip-duplicate --packagePath "${RUNNER_TEMP}"/vsix/*.vsix

      - name: Publish to Open VSX with OVSX_PAT
        if: steps.check.outputs.with == 'token'
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bunx ovsx publish --skip-duplicate --packagePath "${RUNNER_TEMP}"/vsix/*.vsix
