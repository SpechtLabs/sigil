name: Examples

# The examples under examples/, and the Docker image of each. None of them
# ships with a release, so only pull requests run this (through ci.yaml),
# besides runs from the Actions tab. Main's runs never save their caches,
# which is what cache-warm.yaml is for.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# See go.yaml for all three.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.1
  MISE_TOOLS: go golangci-lint yamllint actionlint shellcheck goreleaser bun node go:golang.org/x/perf/cmd/benchstat

jobs:
  # The WebAssembly module the TypeScript and Rust examples load. This
  # workflow builds its own, under an artifact name of its own, so it runs
  # without wasm.yaml and next to it in the same run; the build is the same
  # (see the wasm-build task), and so is the Go cache it restores.
  wasm-build:
    name: WebAssembly module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # The same key as wasm.yaml's wasm-build job.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-wasm-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-wasm-build-${{ runner.os }}-

      - name: Build the module
        run: mise run wasm-build

      - name: Keep the module for the examples that load it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigil-wasm-examples
          path: dist/wasm/sigil.wasm
          if-no-files-found: error
          retention-days: 1

  # examples/deploy-gates is a Go module of its own, so go.yaml's lint and
  # test jobs stop at its go.mod; this runs the same gates inside it. It
  # doesn't start a compose stack or build snapshots; the images job builds
  # its image.
  deploy-gates:
    name: deploy-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/deploy-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}
          working_directory: examples/deploy-gates

      # Restored only: cache-warm.yaml saves it on main, as this workflow never
      # runs there. go.yaml's lint job explains the key; the example builds
      # against the root module through its replace directive, so both
      # modules' go.sum count.
      - name: Restore Go modules and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-deploy-gates-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'examples/deploy-gates/go.mod', 'examples/deploy-gates/go.sum') }}
          restore-keys: go-deploy-gates-${{ runner.os }}-

      # Same key as go.yaml's lint job: custom-gcl is built from the root
      # config and lints every module.
      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      - name: Lint Go
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run lint

      - name: Lint Go with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ../../custom-gcl
          ../../custom-gcl run --config ../../.golangci.yaml --build-tags e2e ./...

      # Includes every policy test file, through policytest.
      - name: Run tests
        run: mise run test

      # sigilc check with the platform as the trusted source, and sigilc test:
      # what a policy repository's CI runs.
      - name: Check policies
        run: mise run policies

      - name: Validate GoReleaser config
        run: mise run release-check

  # examples/alert-routing is a TypeScript service on the module and the
  # package. Its install task builds the package from this checkout first.
  # The Playwright smoke test is the one place a real browser runs the
  # module, through the package's worker helper.
  #
  # Like wasm.yaml's jobs, the examples touch the module they download, so
  # the wasm-build task skips it.
  alert-routing:
    name: alert-routing
    runs-on: ubuntu-latest
    needs: wasm-build
    defaults:
      run:
        working-directory: examples/alert-routing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}
          working_directory: examples/alert-routing

      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm-examples
          path: dist/wasm

      - name: Mark the module up to date
        working-directory: .
        run: touch dist/wasm/sigil.wasm

      - name: Install
        run: mise run install

      # Lint, typecheck, unit and integration tests, the policies through the
      # sigil CLI, and the standalone Next.js build.
      - name: Check
        run: mise run check

      - name: Install Chromium for the UI smoke test
        run: bun run ui:install -- --with-deps

      - name: UI smoke test
        run: bun run test:ui

  # examples/feature-flags is a Rust service on the crate. The policy check
  # runs the sigil CLI with go.
  feature-flags:
    name: feature-flags
    runs-on: ubuntu-latest
    needs: wasm-build
    defaults:
      run:
        working-directory: examples/feature-flags
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See wasm.yaml's rust job.
      - name: Read the pinned Rust version
        id: rust
        working-directory: .
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          components="$(sed -n 's/^rust = {.*components = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "components=${components}" >> "${GITHUB_OUTPUT}"

      - name: Cache the Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.version }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.version }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.components }}

      # MISE_TOOLS plus rust and k6, which only this example's .mise.toml
      # pins, hence the working directory. cache-warm.yaml sets up mise the
      # same way, so main saves this cache too.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }} rust k6
          working_directory: examples/feature-flags

      # See wasm.yaml's rust job. cache-warm.yaml saves this cache on main;
      # pull requests only restore it.
      - name: Cache cargo registry and dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/feature-flags
          shared-key: feature-flags
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the WebAssembly module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigil-wasm-examples
          path: dist/wasm

      - name: Mark the module up to date
        working-directory: .
        run: touch dist/wasm/sigil.wasm

      # Lint, unit and integration tests, the policies through the sigil CLI,
      # the k6 suite parsed, and the release build.
      - name: Check
        run: mise run check

  # Each example's compose stack builds its service's image from the
  # repository root, so CI builds every image the same way and runs nothing
  # in it. The images build sigil.wasm and the service themselves, so these
  # run alongside the example jobs rather than after them.
  #
  # Two caches, both saved on main by cache-warm.yaml and only read here:
  # BuildKit's layer cache, which keeps the layers that download and install
  # dependencies, and the Dockerfiles' cache mounts (Go's module and build
  # caches, bun's, cargo's registry and target directory), which
  # buildkit-cache-dance carries between runs. A pull request that changes
  # source code invalidates the layers that compile it, but those layers then
  # build against compiled dependencies. The mounts' key is what they hold:
  # the Dockerfile and every lockfile the image builds from.
  images:
    name: Docker image (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - alert-routing
          - deploy-gates
          - feature-flags
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Outside the checkout: deploy-gates' build context is the whole
      # repository.
      - name: Restore the cache mounts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-cache
          key: docker-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/Dockerfile', matrix.example), 'go.sum', 'bindings/rust/Cargo.lock', 'bindings/typescript/bun.lock', format('examples/{0}/go.sum', matrix.example), format('examples/{0}/Cargo.lock', matrix.example), format('examples/{0}/bun.lock', matrix.example)) }}
          restore-keys: docker-${{ matrix.example }}-

      # Nothing saves the mounts here, so nothing is extracted afterwards.
      - name: Put the cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/docker-cache
          dockerfile: examples/${{ matrix.example }}/Dockerfile
          skip-extraction: true

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/${{ matrix.example }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.example }}
