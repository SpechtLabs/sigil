name: Extended fuzzing

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzz time per target
        type: choice
        default: 60m
        options:
          - 1m
          - 10m
          - 60m

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned; go.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.2

concurrency:
  group: extended-fuzz-main
  cancel-in-progress: false

jobs:
  targets:
    # Scheduled runs use main; restrict manual dispatches to main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      # One job per target, not per package: a package's targets would
      # otherwise run one after the other, and the campaign take as long as
      # the package with the most of them. Jobs beyond the account's limit
      # on concurrent jobs queue until one finishes.
      - name: Discover fuzz targets
        id: discover
        run: |
          targets=$(go run ./cmd/devtool fuzz list -o json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target.name }}
    needs: targets
    runs-on: ubuntu-latest
    # One target's FUZZ_TIMEOUT, plus setup and building its package.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    # devtool reads each fuzz run flag from FUZZ_<FLAG>.
    env:
      FUZZ_TIME: ${{ inputs.duration || '60m' }}
      FUZZ_TIMEOUT: 90m
      FUZZ_CPU: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      - name: Locate fuzz cache
        id: cache
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      # fuzz run starts by restoring the target's inputs from the
      # fuzz-corpus branch, which this job only reads; the corpus job below
      # pushes what it adds. --verbose keeps go test's output in the job log
      # too; fuzz-results/ holds it with the summary and the tested commit.
      - name: Fuzz target
        env:
          PACKAGE: ${{ matrix.target.package }}
          TARGET: ${{ matrix.target.name }}
        run: go run ./cmd/devtool fuzz run --verbose --filter "^${TARGET}\$" "$PACKAGE"

      # The summary job publishes every target's results at once, from
      # these artifacts; fuzz-results/results.json is what it reads.
      - name: Keep logs and regression inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ strategy.job-index }}
          path: |
            fuzz-results/
            **/testdata/fuzz/**

      # A failed job's inputs count too: what it found interesting is still
      # worth starting from, and its finding is in testdata, not here.
      - name: Keep the corpus for the corpus job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ strategy.job-index }}
          path: ${{ steps.cache.outputs.path }}
          retention-days: 1
          if-no-files-found: ignore

  corpus:
    name: Save the corpus
    needs: [targets, fuzz]
    # Every fuzz job's inputs, whatever its result; there's nothing to save
    # only when discovery failed and no fuzz job ran.
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes to the repository, and it runs no fuzzed code.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      # Each artifact holds one job's fuzz cache; merged, they're one cache
      # laid out the way devtool fuzz corpus push --from reads it.
      - name: Collect every job's corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corpus-*
          path: corpus
          merge-multiple: true

      - name: Push the new inputs to the fuzz-corpus branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if test -d corpus; then
            go run ./cmd/devtool fuzz corpus push --from corpus
          else
            echo "No fuzz job uploaded a corpus."
          fi

  summary:
    name: Summarize the campaign
    needs: [targets, fuzz]
    # Every fuzz job's results, whatever its result; there are none only
    # when discovery failed and no fuzz job ran.
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      - name: Collect every job's results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-*
          path: results

      - name: Publish one summary of every target
        run: go run ./cmd/devtool fuzz summary results >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report failed campaign
    needs: [targets, fuzz]
    # A separate job also reports setup failures and timed-out fuzz jobs.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.targets.result == 'failure' || needs.fuzz.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      # The same summary the summary job publishes, for the issue. A setup
      # failure leaves no results, and the issue goes out without it.
      - name: Collect every job's results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: fuzz-*
          path: results

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          JOBS_RESULT: ${{ needs.fuzz.result }}
          DURATION: ${{ inputs.duration || '60m' }}
        run: |
          summary=()
          if go run ./cmd/devtool fuzz summary results > fuzz-summary.md; then
            summary=(--summary fuzz-summary.md)
          fi
          go run ./cmd/devtool fuzz report \
            --targets-result "$TARGETS_RESULT" \
            --fuzz-result "$JOBS_RESULT" \
            --time "$DURATION" \
            "${summary[@]}"
