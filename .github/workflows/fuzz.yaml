name: Extended fuzzing

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzz time per target
        type: choice
        default: 60m
        options:
          - 1m
          - 10m
          - 60m

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: extended-fuzz-main
  cancel-in-progress: false

jobs:
  targets:
    # Scheduled runs use main; restrict manual dispatches to main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Discover packages with fuzz targets
        id: discover
        run: |
          packages=$(bash scripts/fuzz.sh --list | awk '{print $1}' | sort -u | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().splitlines()))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.targets.outputs.packages) }}
    env:
      FUZZTIME: ${{ inputs.duration || '60m' }}
      FUZZTIMEOUT: 90m
      FUZZPARALLEL: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Locate fuzz cache
        id: cache
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore interesting inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.path }}
          key: fuzz-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('go.mod') }}-

      - name: Fuzz package
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
        run: |
          git rev-parse HEAD | tee fuzz.log
          go version | tee -a fuzz.log
          bash scripts/fuzz.sh "$FUZZ_PACKAGE" 2>&1 | tee -a fuzz.log

      - name: Keep logs and regression inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ strategy.job-index }}
          path: |
            fuzz.log
            **/testdata/fuzz/**

  report:
    name: Report failed campaign
    needs: [targets, fuzz]
    # A separate job also reports setup failures and timed-out fuzz jobs.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.targets.result == 'failure' || needs.fuzz.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          FUZZTIME: ${{ inputs.duration || '60m' }}
        run: bash scripts/report-fuzz-failure.sh
