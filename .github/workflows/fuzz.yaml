name: Extended fuzzing

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzz time per target
        type: choice
        default: 60m
        options:
          - 1m
          - 10m
          - 60m

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned; go.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.1

concurrency:
  group: extended-fuzz-main
  cancel-in-progress: false

jobs:
  targets:
    # Scheduled runs use main; restrict manual dispatches to main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      - name: Discover packages with fuzz targets
        id: discover
        run: |
          packages=$(go run ./cmd/devtool fuzz list --packages -o json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.targets.outputs.packages) }}
    # devtool reads each fuzz run flag from FUZZ_<FLAG>.
    env:
      FUZZ_TIME: ${{ inputs.duration || '60m' }}
      FUZZ_TIMEOUT: 90m
      FUZZ_CPU: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      - name: Locate fuzz cache
        id: cache
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore interesting inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.path }}
          key: fuzz-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('go.mod') }}-

      # --verbose keeps go test's output in the job log too; fuzz-results/
      # holds it with the summary and the tested commit.
      - name: Fuzz package
        env:
          PACKAGE: ${{ matrix.package }}
        run: go run ./cmd/devtool fuzz run --verbose "$PACKAGE"

      - name: Publish results in job summary
        if: always()
        run: |
          if test -f fuzz-results/summary.md; then
            cat fuzz-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep logs and regression inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ strategy.job-index }}
          path: |
            fuzz-results/
            **/testdata/fuzz/**

  report:
    name: Report failed campaign
    needs: [targets, fuzz]
    # A separate job also reports setup failures and timed-out fuzz jobs.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.targets.result == 'failure' || needs.fuzz.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          JOBS_RESULT: ${{ needs.fuzz.result }}
          DURATION: ${{ inputs.duration || '60m' }}
        run: >-
          go run ./cmd/devtool fuzz report
          --targets-result "$TARGETS_RESULT"
          --fuzz-result "$JOBS_RESULT"
          --time "$DURATION"
