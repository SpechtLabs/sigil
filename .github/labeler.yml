# CLI commands and entrypoint
cli:
  - changed-files:
      - any-glob-to-any-file:
          - "cmd/**"
          - "main.go"

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_test.go"
          - "**/testdata/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

# Build, release, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".goreleaser.yaml"
          - ".release-please-config.json"
          - ".release-please-manifest.json"
          - ".mise.toml"
          - ".golangci.yaml"
          - ".custom-gcl.yml"
          - "renovate.json"
          - "go.mod"
          - "go.sum"

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - "^feat"
      - "^feature"

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - "^fix"
      - "^bug"
