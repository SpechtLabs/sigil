# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how sigil is built and checked. CI uses these tasks;
# benchmark comparisons additionally set BENCH_BASELINE. Renovate keeps every
# pin in this file current.

[tools]
# Keep in lockstep with the toolchain directive in go.mod; Renovate bumps both
# together. The go directive (minimum language version) is bumped by hand.
go = "1.27.1"
"go:golang.org/x/perf/cmd/benchstat" = "v0.0.0-20260908200009-22c9c6c9d4da"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Release tooling
goreleaser = "2.18.2"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Documentation website (docs/): VuePress builds under bun, and markdownlint-cli2
# is the same version the docs workflow runs.
bun = "1.4.2"
markdownlint-cli2 = "0.23.3"
# Node, for npm: the release workflow publishes @spechtlabs/sigil with it (see
# release.yaml), and trusted publishing needs npm 11.5 or later.
node = "24.21.0"
# Renders roadmap.yml into docs/project/roadmap.md (see the docs-roadmap task).
"github:SierraSoftworks/roadmap" = "1.4.2"
# Serves the Go API documentation as pkg.go.dev renders it (see the docs-godoc task).
"go:golang.org/x/pkgsite/cmd/pkgsite" = "0.5.0"

[tasks.build]
description = "Build the sigil binary into bin/"
run = "go build -o bin/sigil ./cmd/sigil/"

[tasks.sigil]
description = "Run the sigil binary with go run"
run = "go run -buildvcs=true ./cmd/sigil/"

[tasks.test]
description = "Run the test suite with race detector and coverage"
run = "go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./..."

# `mise run devtool -- <command>` runs any devtool command, e.g.
# `mise run devtool -- bench list` or `mise run devtool -- fuzz run --help`.
# Arguments after -- reach the bench and fuzz tasks too.
#
# Every flag of a bench or fuzz command can also be set as BENCH_<FLAG> or
# FUZZ_<FLAG>, e.g. BENCH_BASELINE=main or FUZZ_TIME=1m.
[tasks.devtool]
description = "Run the repository's development CLI (benchmarks and fuzzing)"
run = "go run ./cmd/devtool"

[tasks.bench]
description = "Measure every benchmark; --baseline (BENCH_BASELINE) compares with a revision and gates regressions above 10%"
run = "go run ./cmd/devtool bench run"

[tasks.bench-smoke]
description = "Run every Go benchmark once to check workload correctness"
run = "go run ./cmd/devtool bench run --no-baseline --count 1 --time 1x"

[tasks.fuzz]
description = "Fuzz every target; --time (FUZZ_TIME) sets the time per target (default 10s)"
run = "go run ./cmd/devtool fuzz run"

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file. The steps run in
# order, because go mod tidy may rewrite go.mod while sigil fmt builds.
[tasks.fmt]
description = "Format everything: go.mod, Go sources, .sigil files and Markdown"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
  { task = "sigil-fmt" },
  { task = "md-fmt" },
]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
run = "golangci-lint fmt"

# The same files sigil-lint checks; see there for what's left out and why.
[tasks.sigil-fmt]
description = "Format every .sigil file in sigil fmt's canonical style"
run = """
git ls-files --cached --others --exclude-standard -z -- '*.sigil' \
  ':!:internal/parser/testdata' ':!:internal/format/testdata' \
  ':!:pkg/policy/testdata/errors_check.sigil' ':!:pkg/policy/testdata/errors_diagnostics.sigil' \
  ':!:cmd/sigil/command/check/testdata/kinds/legacy.sigil' \
  | xargs -0 go run ./cmd/sigil fmt --write
"""

[tasks.md-fmt]
description = "Fix what markdownlint can fix in the documentation and the README"
run = "markdownlint-cli2 --fix 'docs/**/*.md' '*.md'"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

# GoReleaser builds the tagged tree as it is, so an untidy go.mod has to fail
# CI rather than be fixed up at release time.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks.lint]
description = "Lint the Go module with golangci-lint and golint-sl, the WebAssembly glue for wasip1, .sigil formatting, YAML and workflows"
depends = ["lint-build", "sigil-lint", "yaml-lint", "actionlint", "wasm-lint"]
run = "./custom-gcl run ./..."

# The parser's and the formatter's test inputs are unformatted on purpose,
# and errors_check.sigil and errors_diagnostics.sigil don't parse on purpose;
# every other .sigil file, tracked or new, must be in sigil fmt's canonical
# style.
[tasks.sigil-lint]
description = "Check that every .sigil file in the repository is formatted"
run = """
git ls-files --cached --others --exclude-standard -z -- '*.sigil' \
  ':!:internal/parser/testdata' ':!:internal/format/testdata' \
  ':!:pkg/policy/testdata/errors_check.sigil' ':!:pkg/policy/testdata/errors_diagnostics.sigil' \
  ':!:cmd/sigil/command/check/testdata/kinds/legacy.sigil' \
  | xargs -0 go run ./cmd/sigil fmt --check
"""

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks.snapshot]
description = "Build a local GoReleaser snapshot into dist/"
run = "goreleaser build --snapshot --clean"

[tasks.check]
description = "The definition of done: every gate CI runs on the Go code"
depends = [
  "lint",
  "mod-tidy",
  "test",
  "fuzz",
  "bench-smoke",
  "yaml-lint",
  "actionlint",
  "release-check",
]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"

[tasks.docs-lint]
description = "Lint the documentation markdown and roadmap.yml (the docs workflow's first job)"
# roadmap.yml is linted here rather than by yaml-lint in CI: CI skips pull
# requests that only touch documentation, and the roadmap counts as docs.
run = ["markdownlint-cli2 'docs/**/*.md'", "yamllint --strict roadmap.yml"]

[tasks.docs-roadmap]
description = "Validate roadmap.yml and render it into the docs site's roadmap page"
# One source of truth: roadmap.yml at the repository root is canonical (it's
# also where the roadmap.sierrasoftworks.com web viewer looks), and this renders
# it with the roadmap-md renderer. docs/project/roadmap.md is gitignored so
# nobody edits the copy and watches it drift.
run = [
  "roadmap validate roadmap.yml",
  "roadmap render fmd --in roadmap.yml --out docs/project/roadmap.md --collapsed --frontmatter '{title: Roadmap, icon: \"mdi:timeline-outline\", permalink: /project/roadmap/, createTime: \"2026/09/24 22:30:00\", description: \"The Sigil milestones, generated from roadmap.yml\"}'",
]

[tasks.docs-dev]
description = "Serve the documentation website locally with hot reload"
depends = ["docs-roadmap"]
run = "cd docs && bun install && bun run dev"

# pkgsite renders the working tree, both modules, with pkg.go.dev's templates:
# doc links, headings, runnable examples and the command pages. It reads the
# sources once at startup, so restart it to pick up a change. Dependencies
# resolve from the local module cache, so their links work offline.
[tasks.docs-godoc]
description = "Serve the Go API documentation locally, as pkg.go.dev renders it, on localhost:6060"
run = "pkgsite -open -cache -http localhost:6060 . ./examples/deploy-gates"

[tasks.docs-build]
description = "Build the documentation website (the docs workflow's second job)"
depends = ["docs-roadmap"]
run = "cd docs && bun install --frozen-lockfile && bun run build"

# The WebAssembly module (cmd/sigil-wasm): the CLI's engine as a wasip1
# reactor, which bindings/typescript and the docs playground load. -s -w and
# -trimpath keep it small and free of local paths.
[tasks.wasm-build]
description = "Build the WebAssembly module into dist/wasm/sigil.wasm"
env = { GOOS = "wasip1", GOARCH = "wasm" }
run = "go build -buildmode=c-shared -trimpath -ldflags='-s -w' -o dist/wasm/sigil.wasm ./cmd/sigil-wasm"
sources = ["go.mod", "go.sum", "cmd/sigil-wasm/*.go", "internal/**/*.go"]
outputs = ["dist/wasm/sigil.wasm"]

# cmd/sigil-wasm/test is a module of its own, so the wazero runtime its tests
# drive the module with never reaches the library's go.mod. It tests the
# module wasm-build wrote, rather than building its own copy.
[tasks.wasm-test]
description = "Drive the WebAssembly module through its ABI with wazero: every op, host functions, memory, and parity with the CLI"
depends = ["wasm-build"]
dir = "cmd/sigil-wasm/test"
env = { SIGIL_WASM = "../../../dist/wasm/sigil.wasm" }
run = ["go mod tidy -diff", "go test ./..."]

[tasks.wasm-bench]
description = "Measure an evaluation natively, through the engine's JSON, and through the WebAssembly module's ABI"
depends = ["wasm-build"]
dir = "cmd/sigil-wasm/test"
env = { SIGIL_WASM = "../../../dist/wasm/sigil.wasm" }
run = "go test -run '^$' -bench . -count 5 ./..."

# The root lint task covers the engine as the CLI builds it; this lints the
# glue as wasm-build builds it, and the test module, which ./... at the root
# stops at.
[tasks.wasm-lint]
description = "Lint the WebAssembly glue for wasip1 and the module's test module"
depends = ["lint-build"]
run = [
  "GOOS=wasip1 GOARCH=wasm ./custom-gcl run ./cmd/sigil-wasm/... ./internal/engine/...",
  "cd cmd/sigil-wasm/test && ../../../custom-gcl run --config ../../../.golangci.yaml ./...",
]

# bindings/typescript: the module's TypeScript package, which loads the module
# wasm-build writes. It isn't published yet, so nothing but these tasks and CI
# builds it.
[tasks.ts-install]
description = "Install the TypeScript package's dev dependencies"
dir = "bindings/typescript"
run = "bun install --frozen-lockfile"

[tasks.ts-build]
description = "Build the TypeScript package, with the WebAssembly module copied in, into bindings/typescript/dist"
depends = ["wasm-build", "ts-install"]
dir = "bindings/typescript"
run = "bun run build"

# The tests build the sigil CLI with go, to compare their records with its
# JSON, so go must be on PATH too.
[tasks.ts-test]
description = "Type-check the TypeScript package and test it against the WebAssembly module and the sigil CLI"
depends = ["wasm-build", "ts-install"]
dir = "bindings/typescript"
run = ["bun run typecheck", "bun test"]
