# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below are the single definition of how sigil is built and checked.
# CI calls exactly these, so a green `mise run check` locally means a green
# pipeline. Renovate keeps every pin in this file current.

[tools]
# Keep in lockstep with the toolchain directive in go.mod; Renovate bumps both
# together. The go directive (minimum language version) is bumped by hand.
go = "1.27.1"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Release tooling
goreleaser = "2.18.2"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Documentation website (docs/): VuePress builds under bun, and markdownlint-cli2
# is the same version the docs workflow runs.
bun = "1.4.2"
markdownlint-cli2 = "0.23.3"
# Renders roadmap.yml into docs/project/roadmap.md (see the docs-roadmap task).
"github:SierraSoftworks/roadmap" = "1.4.2"

[tasks.build]
description = "Build the sigil binary into bin/"
run = "go build -o bin/sigil ./cmd/sigil/"

[tasks.sigil]
description = "Run the sigil binary with go run"
run = "go run -buildvcs=true ./cmd/sigil/"

[tasks.test]
description = "Run the test suite with race detector and coverage"
run = "go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./..."

[tasks.fuzz]
description = "Fuzz every target; FUZZTIME sets the duration per target (default 10s)"
run = "bash scripts/fuzz.sh"

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file. The steps run in
# order, because go mod tidy may rewrite go.mod while sigil fmt builds.
[tasks.fmt]
description = "Format everything: go.mod, Go sources, .sigil files and Markdown"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
  { task = "sigil-fmt" },
  { task = "md-fmt" },
]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
run = "golangci-lint fmt"

# The same files sigil-lint checks; see there for what's left out and why.
[tasks.sigil-fmt]
description = "Format every .sigil file in sigil fmt's canonical style"
run = """
git ls-files --cached --others --exclude-standard -z -- '*.sigil' \
  ':!:internal/parser/testdata' ':!:internal/format/testdata' \
  ':!:pkg/policy/testdata/errors_check.sigil' \
  | xargs -0 go run ./cmd/sigil fmt --write
"""

[tasks.md-fmt]
description = "Fix what markdownlint can fix in the documentation and the README"
run = "markdownlint-cli2 --fix 'docs/**/*.md' '*.md'"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

# GoReleaser builds the tagged tree as it is, so an untidy go.mod has to fail
# CI rather than be fixed up at release time.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks.lint]
description = "Lint the Go module with golangci-lint and golint-sl, check .sigil formatting, and lint YAML and workflows"
depends = ["lint-build", "sigil-lint", "yaml-lint", "actionlint"]
run = "./custom-gcl run ./..."

# The parser's and the formatter's test inputs are unformatted on purpose,
# and errors_check.sigil doesn't parse on purpose; every other .sigil file,
# tracked or new, must be in sigil fmt's canonical style.
[tasks.sigil-lint]
description = "Check that every .sigil file in the repository is formatted"
run = """
git ls-files --cached --others --exclude-standard -z -- '*.sigil' \
  ':!:internal/parser/testdata' ':!:internal/format/testdata' \
  ':!:pkg/policy/testdata/errors_check.sigil' \
  | xargs -0 go run ./cmd/sigil fmt --check
"""

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.shell-lint]
description = "Lint the fuzz runner and issue reporter"
run = "shellcheck scripts/*.sh"

[tasks.workflow-test]
description = "Test automated fuzz failure reporting without contacting GitHub"
run = "python3 -B -m unittest discover -s scripts -p '*_test.py'"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks.snapshot]
description = "Build a local GoReleaser snapshot into dist/"
run = "goreleaser build --snapshot --clean"

[tasks.check]
description = "The definition of done: every gate CI runs on the Go code"
depends = ["lint", "mod-tidy", "test", "fuzz", "yaml-lint", "actionlint", "shell-lint", "workflow-test", "release-check"]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"

[tasks.docs-lint]
description = "Lint the documentation markdown and roadmap.yml (the docs workflow's first job)"
# roadmap.yml is linted here rather than by yaml-lint in CI: CI skips pull
# requests that only touch documentation, and the roadmap counts as docs.
run = ["markdownlint-cli2 'docs/**/*.md'", "yamllint --strict roadmap.yml"]

[tasks.docs-roadmap]
description = "Validate roadmap.yml and render it into the docs site's roadmap page"
# One source of truth: roadmap.yml at the repository root is canonical (it's
# also where the roadmap.sierrasoftworks.com web viewer looks), and this renders
# it with the roadmap-md renderer. docs/project/roadmap.md is gitignored so
# nobody edits the copy and watches it drift.
run = [
  "roadmap validate roadmap.yml",
  "roadmap render fmd --in roadmap.yml --out docs/project/roadmap.md --collapsed --frontmatter '{title: Roadmap, icon: \"mdi:timeline-outline\", permalink: /project/roadmap/, createTime: \"2026/09/24 22:30:00\", description: \"The Sigil milestones, generated from roadmap.yml\"}'",
]

[tasks.docs-dev]
description = "Serve the documentation website locally with hot reload"
depends = ["docs-roadmap"]
run = "cd docs && bun install && bun run dev"

[tasks.docs-build]
description = "Build the documentation website (the docs workflow's second job)"
depends = ["docs-roadmap"]
run = "cd docs && bun install --frozen-lockfile && bun run build"

# Examples (examples/ is its own Go module)
#
# The examples module keeps the service's dependencies (gin, OpenTelemetry,
# Prometheus) out of the library's go.mod, so the root tasks above never see
# it: `./...` stops at a nested go.mod. These tasks run the same gates inside
# examples/, and the CI examples job calls them.

[tasks.examples-build]
description = "Build deploygate and its sigilc host binary into examples/bin/"
dir = "{{config_root}}/examples"
run = "go build -o bin/ ./cmd/..."

# The e2e suite sits behind the e2e build tag because it needs the compose
# stack. `go test ./...` never compiles it, so it's vetted here on its own and
# linted with the tag, or it would rot until someone next starts the stack.
[tasks.examples-test]
description = "Run the examples' tests with the race detector, including every policy test file, and vet the e2e suite"
dir = "{{config_root}}/examples"
run = [
  "go test -race ./...",
  "go vet -tags e2e ./test/e2e/...",
]

[tasks.examples-lint]
description = "Lint the examples module, e2e suite included, with the root golangci-lint config and the golint-sl plugin"
depends = ["lint-build"]
dir = "{{config_root}}/examples"
run = "../custom-gcl run --config ../.golangci.yaml --build-tags e2e ./..."

# The check a policy repository runs in CI: every team policy type-checks with
# the platform documents as the trusted source and invokes the guardrails at
# the top level, and every test file passes under the sigilc host binary.
[tasks.examples-policies]
description = "Check the example team policies against the platform's guardrails and run their test files with sigilc"
dir = "{{config_root}}/examples"
run = [
  "go run ./cmd/sigilc check --config policies/sigil.yaml --require deploy.guardrails --trusted policies/platform --policy 'payments.*' --policy 'checkout.*' -R policies/teams",
  "go run ./cmd/sigilc test policies",
]

[tasks.examples-generate]
description = "Regenerate the examples' DeployApproval kind file from the Go types"
dir = "{{config_root}}/examples"
run = "go generate ./cmd/sigilc"

[tasks.examples-up]
description = "Start deploygate with the collector, Jaeger, Prometheus and Grafana, and wait until they're up"
dir = "{{config_root}}/examples"
run = "docker compose up --build --wait"

[tasks.examples-down]
description = "Stop the examples' compose stack and drop its volumes"
dir = "{{config_root}}/examples"
run = "docker compose down -v"

[tasks.examples-e2e]
description = "Start the compose stack and run the black-box e2e suite against it"
depends = ["examples-up"]
dir = "{{config_root}}/examples"
env = { DEPLOYGATE_URL = "http://localhost:8080", JAEGER_URL = "http://localhost:16686", PROMETHEUS_URL = "http://localhost:9090" }
# -count=1: the suite checks a running stack, not the code, so a cached pass
# from an earlier run would say nothing about the stack that's up now.
run = "go test -count=1 -tags e2e ./test/e2e/..."

[tasks.examples-release-check]
description = "Validate the examples' GoReleaser config"
dir = "{{config_root}}/examples"
run = "goreleaser check --config .goreleaser.yaml"

[tasks.examples-snapshot]
description = "Build local GoReleaser snapshots of deploygate and sigilc into examples/dist/"
dir = "{{config_root}}/examples"
run = "goreleaser build --snapshot --clean --config .goreleaser.yaml"

[tasks.examples-check]
description = "Every gate CI runs on the examples module"
depends = ["examples-lint", "examples-test", "examples-policies", "examples-release-check"]
