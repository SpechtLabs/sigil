# Codecov fails a pull request only when coverage falls below 85%, for the
# whole project or for the lines the pull request changes. Without this,
# both targets default to the base branch's own coverage, so a change with
# 95% patch coverage is flagged whenever main happens to sit higher.
coverage:
  status:
    project:
      default:
        target: 85%
    patch:
      default:
        target: 85%

# Each upload carries a flag: go from go.yaml's unit tests, typescript and
# rust from the binding jobs in wasm.yaml, and vscode from editors.yaml. A
# flag missing from a commit's uploads keeps its last coverage rather than
# counting as none.
flag_management:
  default_rules:
    carryforward: true
