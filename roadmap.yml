# yaml-language-server: $schema=https://schemas.sierrasoftworks.com/roadmap/v1/schema.json
#
# The single source of the Sigil roadmap. `mise run docs-roadmap` renders it
# into docs/project/roadmap.md with SierraSoftworks' roadmap-md renderer, and
# https://roadmap.sierrasoftworks.com/viewer/github.com#SpechtLabs/sigil
# renders it straight from the default branch. Edit this file, never the
# generated page.

title: Roadmap
description: |
  Sigil is built in milestones, each with a concrete exit criterion. The Go API comes first and the
  kind grammar last, because only tooling parses kind files: the defining host builds its kind from
  Go structs and never reads one. At M4 the language can replace an existing YAML rule set, such as a
  production deploy gate, which is its first real workload.

  Documentation comes first, on purpose. Syntax is cheap to change in a Markdown file and expensive
  to change once policies exist in the wild, and writing the reference pages has already surfaced
  gaps the first sketch of the design glossed over, such as how optional structs get unwrapped. The
  [open questions](/project/open-questions/) note which milestone each one blocks.

authors:
  - name: Cedric Specht
    contact: cedric@specht-labs.de

timeline:
  - date: 2026-09-24
    title: Documentation-first design starts
    description: |
      The language design moves into this documentation site. Nothing is implemented; the docs are
      the specification until M1 closes.
  - date: 2026-09-28
    title: Assertions, collecting kinds, lets and optional structs settled
    description: |
      A second pass over the open questions: `assert("reason", cond)` with input and outcome
      phases, `collect one` and `collect all`, scoped and `pub` lets, optional chaining with
      `present`, scalar-only equality, and host-ordered types for versions. Everything the
      implemented milestones cover lands in the parser, checker and evaluator; the rest is
      tracked below.
  - date: 2026-09-28
    title: Kinds, the type checker and expression evaluation implemented
    description: |
      M3 closes: a policy is checked against its kind with a hint for every typo and type
      mismatch, and its expressions evaluate against the host's Go structs.
  - date: 2026-09-27
    title: Front end implemented
    description: |
      The lexer, the Pratt expression parser and the document parser land under `internal/`, with
      golden tests for every document form and every error message. Type checking and evaluation
      are next.

objectives:
  - title: Replace hand-rolled YAML rule engines
    description: |
      Teams keep rebuilding YAML rule engines with label-selector matchers. Sigil succeeds when a
      real one, such as a production deploy gate, runs on Sigil instead and its existing test
      cases pass unchanged.

  - title: Readable on first contact, strict enough to trust with a deny
    description: |
      Any engineer should be able to read a policy without learning a new paradigm, and a typo must
      fail at compile time instead of silently switching a deny rule off.

  - title: Errors that tell you the fix
    description: |
      Every compile error carries a file, line and column, what went wrong and a concrete fix,
      quoting the kind's signature when a type or payload is wrong. Golden tests pin every message,
      so a refactor that makes an error less helpful shows up as a diff.

  - title: Policy repos that stand on their own
    description: |
      A team's policy repository lints, formats and tests in CI from the exported kind file alone,
      without importing the host's Go code.

milestones:
  - title: Language specification
    description: |
      Write the language down precisely enough that the parser, type checker and evaluator can be
      built against it, and settle the open questions that would otherwise be decided by whatever
      the first implementation happened to do.

      **Done when** every open question that blocks M2 has an answer.
    deliverables:
      - title: Language reference
        state: DONE
        requirement: MUST
        description: |
          Lexical structure, policy files, expressions, types, decisions, evaluation semantics and
          kind files, stated as normative rules.
        reference: https://github.com/SpechtLabs/sigil/tree/main/docs/reference
      - title: Formal grammar
        state: DONE
        requirement: MUST
        description: |
          W3C-style EBNF for policy and kind files, with the operator precedence table.
      - title: Rationale, tour and guides
        state: DONE
        requirement: SHOULD
        description: |
          The understanding pages, the getting-started path and the how-to guides, so reviewers can
          judge the design by reading policies rather than grammar.
      - title: Imports and policy invocation
        state: DONE
        requirement: MUST
        description: |
          `use` becomes import-only, modules hold shared `let`s, policies are invoked like decision
          constructors and can be gated by `when`, and the host protects guardrails with
          `policy.Require`.
        reference: https://github.com/SpechtLabs/sigil/blob/main/docs/understanding/composition.md
      - title: Answer the syntax-affecting open questions
        state: DOING
        requirement: MUST
        description: |
          Settled with the parser: quantifier body extent, chained comparisons, keywords as field
          names, `assert("reason", cond)` with the reason first, `collect one` and `collect all`,
          scoped lets and `pub let`, optional chaining with `?.` and `present`, and param bounds
          as `, min: value, max: value`. Boolean operator
          spelling is settled: words. Still open: glob syntax (M3) and multiple decisions per
          block (M4); the parser accepts several.
      - title: Published documentation site
        state: DONE
        requirement: SHOULD
        description: |
          The VuePress site, built and deployed from `docs/` on every push to `main`.

  - title: Expressions
    description: |
      The front end of the language. The parser is hand-written: recursive descent for statements and
      a Pratt parser for expressions. A generator like goyacc or ANTLR would get a working parser
      sooner, but a hand-written one knows exactly what it expected at each point and can say "did
      you mean `tier`?" instead of "syntax error near IDENT". Every statement starts with a
      keyword or, for a policy invocation, with a name followed by `(`, so one token of lookahead
      is enough to pick a statement parser.

      **Done when** golden tests cover every operator and every error message. They do: see
      `internal/parser/testdata`.
    deliverables:
      - title: Lexer
        state: DONE
        requirement: MUST
        description: Identifiers, strings, raw strings, numbers, chained durations, comments and the `---` document separator, with positions.
      - title: Pratt expression parser
        state: DONE
        requirement: MUST
        description: One binding power per level of the precedence table, including quantifiers and the non-associative comparison level.
      - title: AST with source positions
        state: DONE
        requirement: MUST
      - title: Error messages with fix hints
        state: DONE
        requirement: MUST
        description: The `file:line:col`, caret and `help:` format used throughout the docs.
      - title: Golden tests
        state: DONE
        requirement: MUST
        description: |
          Including document boundaries: `kind:` and `policy:` fields in a `type` body, a `kind`
          payload field, and `resource.kind` in a condition must never start a new document.

  - title: Types
    description: |
      Turn Go structs into a kind and check expressions against it. This is where the design's main
      promise lands: a typo like `service.teir` fails at compile time instead of turning a deny
      rule off at runtime.

      **Done when** typos and type mismatches fail at compile time with a hint.
    deliverables:
      - title: Type model and kind contract
        state: DONE
        requirement: MUST
        description: |
          The sealed type language and the kind model, with every validity rule from the kind-files
          page in one place, so a kind loaded from a file and one reflected from Go structs are
          checked the same way. Map keys follow Go's rule: any scalar.
      - title: Kind file loader
        state: DONE
        requirement: MUST
        description: |
          Loads a kind document into the model with positioned diagnostics and a did-you-mean hint
          for unknown types, and prints a kind back as canonical source, which is what `Schema()`
          exports and what the round-trip test compares.
      - title: NewKind reflection
        state: DONE
        requirement: MUST
        description: |
          Walks the input struct, the payload structs and the host functions once and records the
          Go field paths and function values for the evaluator, so evaluation never touches
          `reflect`. Panics with every problem at once, like `regexp.MustCompile`.
      - title: Type checker
        state: DONE
        requirement: MUST
        description: |
          Every expression gets a type by the operator tables, empty literals take theirs from
          context, lets are typed in dependency order with cycles reported, and constructors are
          checked against their decision's payload. Unknown names and fields get a did-you-mean
          hint. Imports and invocations are reported as unsupported until M5.
      - title: Evaluator over Go structs
        state: DONE
        requirement: MUST
        description: |
          A checked expression compiles once into closures that read the host's own Go values in
          place through the field paths NewKind recorded. Runtime errors point at the expression
          that failed. Rules, precedence and the trace come with M4.
      - title: Optional structs and presence
        state: DONE
        requirement: MUST
        description: |
          `release?.soak` reads a field of an optional struct, and a `?.` that finds its operand
          absent makes the rest of the chain absent, as in TypeScript. `present x` tests an
          optional without unwrapping it. Pointers to slices and maps are rejected, since an
          absent collection would read the same as an empty one.
        reference: https://github.com/SpechtLabs/sigil/blob/main/docs/reference/expressions.md
      - title: Scoped and exported lets in the checker
        state: DONE
        requirement: MUST
        description: |
          A `let` inside a `when` body is visible there only, can't shadow anything and has a name
          unique in its document. A `let` is private unless it's `pub let`, and a policy's
          `pub let` can't read a param. Evaluating scoped lets comes with M4, the import side
          with M5.
      - title: Element comparison
        state: DONE
        requirement: MUST
        description: |
          `==` works on scalars only and strings aren't ordered. `in`, the list operators and
          `has` compare lists and maps structurally and reject struct elements, which the
          evaluator used to answer `false` for without saying so.

  - title: Policies
    description: |
      The first milestone with a user. Porting a YAML rule set that runs in production today and passing
      its test cases is the test of whether the language can replace what it's meant to replace.

      **Done when** an existing YAML rule set, such as a production deploy gate, is ported and its test cases pass.
    deliverables:
      - title: when blocks and decision constructors
        state: TODO
        requirement: MUST
      - title: Precedence and default
        state: TODO
        requirement: MUST
        description: |
          A `collect one` kind returns its highest-ranked candidate, or the default when nothing
          fires.
      - title: Collecting kinds
        state: TODO
        requirement: MUST
        description: |
          A `collect all` kind returns every candidate that fired, sorted by the kind's declaration
          order, and an empty outcome on a runtime error. `outcome` holds every distinct decision.
        reference: https://github.com/SpechtLabs/sigil/blob/main/docs/reference/evaluation.md
      - title: Assertions
        state: TODO
        requirement: MUST
        description: |
          Input asserts, whose condition doesn't read `outcome`, run before any rule; outcome
          asserts run once the outcome exists. A failing phase ends the evaluation with a
          `*policy.AssertionError` listing every failure of that phase, and an assert whose own
          condition raises a runtime error counts as failed.
        reference: https://github.com/SpechtLabs/sigil/blob/main/docs/reference/evaluation.md
      - title: Scoped lets at evaluation
        state: TODO
        requirement: MUST
        description: |
          A `let` inside a `when` body is evaluated lazily, at most once per evaluation, and only
          when its body is reached.
      - title: Host-ordered types
        state: TODO
        requirement: SHOULD
        description: |
          `policy.WithOrdered[*semver.Version]("Version")` and `type Version ordered` give a Go
          type with `Compare(T) int` the ordinary comparison operators, printed through
          `MarshalText` or `String`. Deploy gates often compare versions, so the port below is
          likely to need it. Nothing else blocks it: kinds, the checker and the evaluator exist.
        reference: https://github.com/SpechtLabs/sigil/blob/main/docs/reference/types.md
      - title: Evaluation trace
        state: TODO
        requirement: MUST
        description: Every candidate, and for each candidate of the winning decision, which conditions held.
      - title: Port a real YAML rule set
        state: TODO
        requirement: MUST

  - title: Composition
    description: |
      The templating story from [Composition without templating](/understanding/composition/). Until
      this lands, per-team variants still need copying. Invocation makes composition flexible, so
      `sigil explain` ships with it: what a composed policy actually does has to stay one command
      away.

      **Done when** a team policy invokes the platform's policies with custom params, under a
      condition, and the host rejects it when a required guardrail is gated.
    deliverables:
      - title: param and let
        state: TODO
        requirement: MUST
        description: |
          Params bound by invocation or by `policy.Params`, each value checked against the
          param's `min` and `max` when the policy compiles or loads. Declaring bounds and
          checking them against the default already works.
      - title: Modules and imports
        state: TODO
        requirement: MUST
        description: |
          `module` files, whole-file, selective and aliased `use`, and only `pub let`s importable:
          a `use` that names a private `let` is a compile error.
      - title: Policy invocation
        state: TODO
        requirement: MUST
        description: |
          Invocations at the top level and inside `when`, with named, type-checked arguments and
          the call site recorded in every candidate's trace.
      - title: policy.Require
        state: TODO
        requirement: MUST
        description: Load option that fails compilation unless the named policies are invoked unconditionally.
      - title: Bundle loader
        state: TODO
        requirement: MUST
        description: |
          Reads every document in every `.sigil` file of an `fs.FS`, indexes them by header name
          and rejects duplicates, so `embed.FS`, `os.DirFS`, a mounted ConfigMap and
          `policy.MapFS` all work. Uses `fs.Stat`, so the symlinked keys of a mounted ConfigMap
          load; a test builds the real `..data` layout. Kind documents must match `Schema()`.
      - title: policy.From
        state: TODO
        requirement: MUST
        description: |
          Takes required policies, and everything they use, from a trusted source, and makes a
          bundle document that claims a trusted name a compile error.
      - title: Cycle detection
        state: TODO
        requirement: MUST
        description: The `let`, import and invocation graphs must be acyclic.
      - title: sigil explain
        state: TODO
        requirement: MUST
        description: Flattens a policy into its guarded decisions, with every invocation inlined and params bound.

  - title: Tooling I
    description: |
      Move checking into policy repositories, so teams find errors in CI rather than when the host
      loads their policy.

      **Done when** a policy repo lints in CI without the host's code.
    deliverables:
      - title: sigil fmt
        state: TODO
        requirement: MUST
        description: One canonical style, like `gofmt`. A whitespace-insensitive grammar drifts without it.
      - title: Kind export with Schema()
        state: TODO
        requirement: MUST
      - title: sigil check
        state: TODO
        requirement: MUST
      - title: sigil eval and sigil test
        state: TODO
        requirement: MUST
      - title: Lints
        state: TODO
        requirement: SHOULD
        description: |
          The lints on the CLI page, reported by `sigil check` as warnings: `unused-import`,
          `unused-let`, `gated-assert`, `gated-deny`, `duplicate-invocation`, `duplicate-reason`,
          `qualified-imports` and `path-matches-name`, and a way for a repository to promote one
          to an error.
        reference: https://github.com/SpechtLabs/sigil/blob/main/docs/reference/cli.md
      - title: policytest package for go test
        state: TODO
        requirement: SHOULD

  - title: Hardening
    description: |
      The round-trip property test guards the kind export, and fuzzing guards the parser against
      inputs nobody thought to write a test for.

      **Done when** a day of fuzzing finds no panics, and `Import(Export(k)) == k` holds.
    deliverables:
      - title: LoadKind
        state: TODO
        requirement: MUST
      - title: Round-trip property test
        state: TODO
        requirement: MUST
      - title: Parser fuzzing
        state: TODO
        requirement: MUST
        description: "`go test -fuzz` on the parser."
      - title: Static cost analysis
        state: TODO
        requirement: SHOULD
        description: Worst-case cost from declared collection sizes, with a budget the host can enforce.

  - title: Tooling II
    description: |
      Editor support and cross-service consumption. It comes last because it depends on the kind
      file format being stable, and that format only settles once the earlier milestones have
      exercised it.

      **Done when** editor completion works from an exported kind file alone.
    deliverables:
      - title: sigil lsp (language server)
        state: TODO
        requirement: SHOULD
      - title: sigil gen go (typed code generation)
        state: TODO
        requirement: SHOULD
      - title: sigil breaking
        state: TODO
        requirement: MUST
        description: Flags incompatible kind changes in CI, modeled on `buf breaking`.
