version: 2

project_name: sigil

builds:
  - id: sigil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: sigil
    main: ./cmd/sigil
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: &ldflags
      - -s -w
      # Only the version is injected; commit, commit time and dirty state come
      # from the VCS info the Go toolchain embeds (see `sigil version`).
      - -X=main.version={{ .Version }}

  - id: sigil-wasm
    env:
      - CGO_ENABLED=0
    goos:
      - wasip1
    goarch:
      - wasm
    # GoReleaser adds the .wasm extension for this target.
    binary: sigil
    main: ./cmd/sigil-wasm
    # c-shared produces a reactor with _initialize and the Sigil ABI exports.
    buildmode: c-shared
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags: *ldflags

archives:
  - id: sigil
    ids:
      - sigil
      - sigil-wasm
    name_template: "sigil_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Publish to SpechtLabs/homebrew-tap using HOMEBREW_TAP_GITHUB_TOKEN, a
# repository or organization Actions secret with Contents: read and write
# access to the tap. The default GITHUB_TOKEN only has access to this repo.
homebrew_casks:
  - name: sigil
    ids:
      - sigil
    repository:
      owner: SpechtLabs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/SpechtLabs/sigil"
    description: "Small, statically typed policy language for Go hosts"
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@specht-labs.de
    # Sigil is not Apple-notarized. Remove quarantine from the installed binary
    # so Gatekeeper allows it to run, as with the other CLIs in the tap.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sigil"]
          end

# release-please writes the changelog and creates the GitHub release; GoReleaser
# only attaches the artifacts to it.
changelog:
  disable: true

# A keyless cosign signature over checksums.txt, as a Sigstore bundle, covers
# every archive through its checksum. `artifacts: binary` would sign nothing:
# it only matches binaries released on their own, and ours ship in archives.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  github:
    owner: spechtlabs
    name: sigil
  mode: keep-existing
