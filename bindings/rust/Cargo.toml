[package]
name = "spechtlabs-sigil"
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
description = "Embed Sigil, a typed policy language, in Rust: the Go engine as a WebAssembly module on wasmtime"
license = "Apache-2.0"
repository = "https://github.com/SpechtLabs/sigil"
homepage = "https://github.com/SpechtLabs/sigil/tree/main/bindings/rust#readme"
readme = "README.md"
keywords = ["policy", "sigil", "webassembly", "wasmtime", "authorization"]
categories = ["wasm", "config"]
# The release workflow copies sigil.wasm to module/ before cargo publish, so the
# crate ships the module and installing it needs no Go.
include = ["src/**", "module/sigil.wasm", "build.rs", "README.md", "LICENSE", "Cargo.toml"]

[lib]
name = "sigil"

[features]
default = ["bundled"]
# Embeds sigil.wasm in the crate: Sigil::bundled() and Module::bundled(). build.rs
# reads it from $SIGIL_WASM, module/sigil.wasm (in the published package) or
# ../../dist/wasm/sigil.wasm (mise run wasm-build, in the repository).
bundled = []
# Async variants that run the blocking calls on tokio's blocking pool:
# Pool::evaluate_async, Pool::compile_async and Policy::eval_async. Off by
# default so a synchronous host's dependency tree has no tokio.
tokio = ["dep:tokio"]
# Precompiles the bundled module for the target at build time, so
# Module::bundled() loads native code in milliseconds instead of compiling
# 11 MB of WebAssembly with Cranelift at every start (seconds of CPU). Costs a
# longer build, which runs Cranelift once, and a larger binary, which embeds the
# native code as well. Falls back to compiling when wasmtime refuses the
# artifact, or with fuel metering on.
precompiled = ["bundled", "dep:wasmtime"]

[dependencies]
tokio = { version = "1.53.2", optional = true, default-features = false, features = ["rt"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
unicode-general-category = "1.1.0"
# Only what the crate uses: compile with Cranelift, run, epoch interruption and fuel.
# Not the defaults: GC, components, profiling and the on-disk cache are dead weight here.
wasmtime = { version = "49.0.2", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }

[build-dependencies]
# The same wasmtime, under another name so the feature above can make it
# optional. build.rs runs its compiler with the engine configuration of
# src/engine.rs.
wasmtime = { version = "49.0.2", optional = true, default-features = false, features = ["cranelift", "std", "parallel-compilation"] }

[dev-dependencies]
# Text format for the tiny modules the unit tests assemble.
wasmtime = { version = "49.0.2", default-features = false, features = ["wat"] }
rstest = "0.27.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "rt"] }

[[test]]
name = "kind"
required-features = ["bundled"]

[[test]]
name = "limits"
required-features = ["bundled"]

[[test]]
name = "pool"
required-features = ["bundled"]

[[test]]
name = "require"
required-features = ["bundled"]

[[test]]
name = "sigil"
required-features = ["bundled"]

[[test]]
name = "async_runtime"
required-features = ["bundled"]

[[test]]
name = "precompile"
required-features = ["bundled"]

# Every test binary compiles sigil.wasm with Cranelift once, and a Cranelift
# built without optimizations takes over a minute for that on a CI runner, so
# the dependencies build optimized and without debuginfo. The crate itself
# still builds unoptimized, with debuginfo. Cargo reads profiles from the
# workspace root only, so this never reaches a crate that depends on this one;
# examples/feature-flags sets the same.
[profile.dev.package."*"]
opt-level = 3
debug = false
