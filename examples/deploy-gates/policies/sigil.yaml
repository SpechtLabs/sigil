# What `sigilc check` enforces. It looks for sigil.yaml in the working
# directory and its parents, and CI runs from examples/deploy-gates/, so
# pass --config policies/sigil.yaml. Paths are relative to this file.

# Both kind files, so that a command on one directory, such as
# `sigil check teams/payments` or `sigil test access` from here, finds the
# kinds its policies name. A kind file that is also among the paths is read
# once.
kinds: [deploy_approval.sigil, access_grant.sigil]

require:
  # The Require deploygate makes when it loads a team's deploy policy: every
  # team root invokes the platform's guardrails at the top level, read from
  # the platform's own documents rather than from anything a team wrote.
  - policy: deploy.guardrails
    trusted: [platform/deploy]
    roots: ["payments.*", "checkout.*"]
  # The same for the access policy, against the access guardrails.
  - policy: access.guardrails
    trusted: [platform/access]
    roots: [access.main]
lints:
  # A deny invoked under `when` only fires while the gate holds. The platform
  # requires deploy.guardrails anyway, but a team that gates its own denies is
  # almost always a mistake worth failing the pull request for.
  gated-deny: error
  # The same mistake for the access policies: AccessGrant collects, so it has
  # no deny, and its guardrails are the asserts in access.guardrails. Invoked
  # under `when`, they'd only be checked while the gate holds.
  gated-assert: error
  # A policy repository maps teams/<team>/ to each team in CODEOWNERS, which
  # only protects a policy if it lives in the file its name says. The lint
  # matches on the path's suffix, so teams/payments/production.sigil satisfies
  # payments.production.
  path-matches-name: error
