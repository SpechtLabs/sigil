# OpenTelemetry Collector for the deploygate compose stack.
#
# deploygate sends its traces to this collector rather than to Jaeger directly.
# That keeps the service configured the way it would be in a cluster, where a
# collector sits between every workload and the tracing backend. Logs go to
# stdout (`docker compose logs deploygate`), so there is no logs pipeline.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Jaeger v2 takes OTLP natively; the stack has no TLS.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
  telemetry:
    # The collector's own metrics (spans received, exported, refused), scraped
    # by Prometheus so a missing trace can be told apart from a dropped one.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
