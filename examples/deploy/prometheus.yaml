# Prometheus for the deploygate compose stack.
#
# The 5s interval is shorter than anything production would use, so the
# dashboard reacts within seconds of a request or a policy reload in the demo.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: deploygate
    metrics_path: /metrics
    static_configs:
      - targets: ["deploygate:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
