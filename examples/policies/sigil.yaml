# Lint levels for `sigilc check`. It looks for sigil.yaml in the working
# directory and its parents, and CI runs from examples/, so pass
# --config policies/sigil.yaml.
lints:
  # A deny invoked under `when` only fires while the gate holds. The platform
  # requires deploy.guardrails anyway, but a team that gates its own denies is
  # almost always a mistake worth failing the pull request for.
  gated-deny: error
  # The same mistake for the access policies: AccessGrant collects, so it has
  # no deny, and its guardrails are the asserts in access.guardrails. Invoked
  # under `when`, they'd only be checked while the gate holds.
  gated-assert: error
  # A policy repository maps teams/<team>/ to each team in CODEOWNERS, which
  # only protects a policy if it lives in the file its name says. The lint
  # matches on the path's suffix, so teams/payments/production.sigil satisfies
  # payments.production.
  path-matches-name: error
