[package]
name = "featuregate"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
description = "A feature-flag service that speaks OFREP; every flag's rollout is a Sigil policy"
license = "Apache-2.0"
publish = false
default-run = "featuregate"

[lib]
name = "featuregate"

[[bin]]
name = "featuregate"
path = "src/main.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[features]
# The e2e suite drives the compose stack over HTTP; it's off by default so
# `cargo test` needs nothing running.
e2e = []

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1.5"
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] }
prometheus = { version = "0.14.0", features = ["process"] }
pyroscope = { version = "0.5.8", default-features = false }
pyroscope_pprofrs = "0.2.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"

sha2 = "0.11.0"
spechtlabs-sigil = { path = "../../bindings/rust" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.27.0"
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }

