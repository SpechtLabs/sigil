# deploygate and a local Grafana LGTM stack. Alloy sends traces to Tempo,
# metrics to Mimir, and the service's Docker logs to Loki. All backends run as
# one process with filesystem storage in named volumes.
#
# Run from examples/: docker compose up --build --wait
# Grafana: http://localhost:3000/d/deploygate
# API: 8080, Alloy: 12345 and OTLP 4317/4318, Tempo: 3200, Loki: 3100,
# Mimir: 9009.
#
# ./policies/teams is mounted read-only as the team bundle (DeployApproval) and
# ./policies/access as the access bundle (AccessGrant). Edit a policy in either
# on the host and deploygate picks it up within DEPLOYGATE_RELOAD_INTERVAL, or
# at once with `curl -X POST localhost:8080/api/v1/policies/reload`.

name: deploygate

services:
  deploygate:
    build:
      # The repository root: the examples module builds against the library
      # through `replace ../`, so the library sources must be in the context.
      context: ..
      dockerfile: examples/Dockerfile
      args:
        VERSION: compose
    image: deploygate:compose
    ports:
      - "8080:8080"
    environment:
      DEPLOYGATE_POLICIES: /etc/deploygate/policies
      DEPLOYGATE_ACCESS_POLICIES: /etc/deploygate/access
      DEPLOYGATE_TEAMS: payments,checkout
      # Short, so a policy edit on the host shows up while you watch.
      DEPLOYGATE_RELOAD_INTERVAL: 5s
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: deploygate
    volumes:
      - ./policies/teams:/etc/deploygate/policies:ro
      - ./policies/access:/etc/deploygate/access:ro
    # The image has no shell or HTTP client, so the binary probes its own
    # /readyz. It turns healthy once both bundles have loaded, which is what
    # `up --wait` and the e2e suite wait for.
    healthcheck:
      test: ["CMD", "/deploygate", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      alloy:
        condition: service_started
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data, --server.http.listen-addr=0.0.0.0:12345]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-deploygate}
    volumes:
      - ./deploy/alloy.alloy:/etc/alloy/config.alloy:ro
      # Alloy reads this project's deploygate logs through the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      mimir:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    command: [-config.file=/etc/tempo.yaml]
    ports:
      - "3200:3200"
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki.yaml]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  mimir:
    image: grafana/mimir:3.2.1
    command: [-config.file=/etc/mimir.yaml]
    ports:
      - "9009:9009"
    volumes:
      - ./deploy/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    environment:
      # A local demo: anyone who reaches port 3000 is an admin, and there is
      # no login screen in the way.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/deploygate.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      # The backend images have no HTTP client. This probe waits for the
      # whole pipeline, so `up --wait` also guarantees backend readiness.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:3000/api/health &&
          wget -q -O /dev/null http://alloy:12345/-/ready &&
          wget -q -O /dev/null http://tempo:3200/ready &&
          wget -q -O /dev/null http://loki:3100/ready &&
          wget -q -O /dev/null http://mimir:9009/ready
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      alloy:
        condition: service_started
    restart: unless-stopped

volumes:
  alloy-data:
  tempo-data:
  loki-data:
  mimir-data:
