# golangci-lint configuration for sigil.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      # fieldalignment stays on: the language runtime should keep structs
      # compact. The CLI under cmd/ is excluded below.
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      # The CLI isn't on the hot path, so its structs are laid out for
      # readability rather than size. Neither are test tables.
      - linters:
          - govet
        text: "^fieldalignment:"
        path: ^cmd/

      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # types mirrors go/types; the singular would read as a variable name.
      - linters:
          - golint-sl
        text: "^pkgnaming:"
        path: ^internal/types/

      # The checker's and the compiler's rule methods take AST nodes the
      # parser guarantees are non-nil, and the policy package's helpers
      # take outcomes the evaluator guarantees; returning quietly on nil
      # would hide a bug rather than prevent one.
      - linters:
          - golint-sl
        text: "^nilcheck:"
        path: ^(internal/(ast|check|eval)|pkg/policy)/

      # The public API returns typed errors (*CompileError, *AssertionError,
      # *RuntimeError) that hosts match with errors.As, each carrying its own
      # position and fix hint, passes loader errors through unwrapped since
      # they already carry advice, returns fs.FS and option interfaces by
      # design, and its options are values, because policy.Params is a map
      # literal in the documented API.
      - linters:
          - golint-sl
        text: "^(humaneerror|optionspattern|returninterface|errorwrap):"
        path: ^pkg/policy/

      # Runtime values are boxed as any when they cross into host data, and
      # a runtime error already carries the failing expression's position.
      - linters:
          - golint-sl
        text: "^(emptyinterface|errorwrap):"
        path: ^internal/eval/

      # Constants are dynamically typed by design (their Sigil type is
      # checked separately), and the diagnostics it returns already carry
      # position and hint; wrapping would only bury them.
      - linters:
          - golint-sl
        text: "^(emptyinterface|errorwrap):"
        path: ^internal/constant/

    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
